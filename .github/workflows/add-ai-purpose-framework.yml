name: Add AI with Purpose framework

on:
  push:
    paths:
      - '.github/workflows/add-ai-purpose-framework.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-page:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Add bilingual purpose-to-value framework
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('ai-solutions.html')
          text = path.read_text(encoding='utf-8')

          css = r'''
.purpose-framework{position:relative;margin:0 0 26px;padding:25px;border:1px solid rgba(251,191,36,.36);border-radius:28px;background:radial-gradient(circle at 50% 0,rgba(251,191,36,.11),transparent 36%),linear-gradient(145deg,rgba(19,37,57,.94),rgba(7,21,37,.92));box-shadow:0 20px 55px rgba(0,0,0,.25);overflow:hidden}.purpose-framework::before{content:"AI with Purpose";position:absolute;top:0;left:50%;transform:translateX(-50%);padding:7px 22px;border-radius:0 0 16px 16px;background:linear-gradient(135deg,#fbbf24,#f59e0b);color:#07111f;font-weight:900;letter-spacing:.02em}.purpose-intro{text-align:center;max-width:920px;margin:30px auto 22px}.purpose-intro h2{margin:0;font-size:clamp(1.55rem,3vw,2.45rem)}.purpose-intro h2 span{display:block;direction:rtl;margin-top:4px;font-size:.78em;color:#fff3c4}.purpose-intro p{margin:9px auto 0;color:#c4d3df}.purpose-chain{display:grid;grid-template-columns:1fr auto 1fr auto 1fr auto 1fr;align-items:stretch;gap:11px}.purpose-step{position:relative;min-height:128px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:17px 14px;border:1px solid var(--line);border-radius:18px;background:rgba(255,255,255,.03)}.purpose-step::before{content:attr(data-number);position:absolute;top:10px;left:11px;width:27px;height:27px;display:grid;place-items:center;border-radius:50%;background:rgba(251,191,36,.13);border:1px solid rgba(251,191,36,.45);color:#fde68a;font-size:.78rem;font-weight:800}.purpose-step strong{display:block;font-size:1rem;color:#fff}.purpose-step span{display:block;direction:rtl;margin-top:5px;color:#e5edf4;font-size:.94rem}.purpose-step small{display:block;margin-top:7px;color:#9fb3c5;font-size:.78rem}.purpose-arrow{display:grid;place-items:center;color:#fbbf24;font-size:1.65rem;font-weight:900}.concept-difference{display:grid;grid-template-columns:repeat(3,1fr);gap:13px;margin-top:20px}.concept-card{padding:16px;border-radius:17px;border:1px solid var(--line);background:rgba(255,255,255,.025)}.concept-card.purpose{border-color:rgba(251,191,36,.48);background:linear-gradient(135deg,rgba(251,191,36,.10),rgba(255,255,255,.02))}.concept-label{display:inline-flex;margin-bottom:9px;padding:4px 9px;border-radius:999px;background:rgba(56,189,248,.10);border:1px solid rgba(56,189,248,.28);color:#bfe9ff;font-size:.76rem;font-weight:800}.concept-card.purpose .concept-label{background:rgba(251,191,36,.11);border-color:rgba(251,191,36,.35);color:#fde68a}.concept-card h3{margin:0 0 7px;font-size:1.05rem}.concept-card h3 span{display:block;direction:rtl;margin-top:3px;font-size:.88em}.concept-card p{margin:0;color:#b8c9d7;font-size:.87rem}.concept-card .ar{direction:rtl;text-align:right;margin-top:8px;color:#e8eff5}.umbrella-note{display:flex;align-items:center;justify-content:center;gap:11px;margin-top:18px;padding:13px 15px;border-radius:16px;border:1px dashed rgba(251,191,36,.48);background:rgba(251,191,36,.055);text-align:center;color:#e9f1f7}.umbrella-note b{color:#fde68a}.umbrella-note span{direction:rtl}@media(max-width:1050px){.purpose-chain{grid-template-columns:1fr}.purpose-arrow{transform:rotate(90deg);min-height:24px}.concept-difference{grid-template-columns:1fr}}@media(max-width:640px){.purpose-framework{padding:15px;border-radius:22px}.purpose-framework::before{font-size:.8rem;padding:6px 15px}.purpose-intro{margin-top:34px}.purpose-step{min-height:112px}.umbrella-note{align-items:flex-start;flex-direction:column}}
'''

          if '.purpose-framework{' not in text:
              marker = '.overview{'
              if marker not in text:
                  raise SystemExit('CSS insertion marker not found')
              text = text.replace(marker, css + marker, 1)

          html = r'''
<section class="purpose-framework" aria-labelledby="purpose-title">
  <div class="purpose-intro">
    <h2 id="purpose-title">From a Real Problem to Measurable Value<span lang="ar">من مشكلة حقيقية إلى قيمة قابلة للقياس</span></h2>
    <p>AI with Purpose starts with the need, selects the right technology and application, and ends with a result that can be measured.<br><span lang="ar" dir="rtl">يبدأ الذكاء الاصطناعي الهادف بالحاجة الحقيقية، ثم يختار التقنية والتطبيق المناسبين، وينتهي بنتيجة يمكن قياسها.</span></p>
  </div>

  <div class="purpose-chain" aria-label="AI with Purpose logical relationship">
    <div class="purpose-step" data-number="1">
      <strong>Industrial Problem</strong>
      <span lang="ar">مشكلة حقيقية</span>
      <small>What must be improved or solved?</small>
    </div>
    <div class="purpose-arrow" aria-hidden="true">→</div>
    <div class="purpose-step" data-number="2">
      <strong>Defined Purpose</strong>
      <span lang="ar">هدف واضح</span>
      <small>What outcome should AI achieve?</small>
    </div>
    <div class="purpose-arrow" aria-hidden="true">→</div>
    <div class="purpose-step" data-number="3">
      <strong>Appropriate AI Solution</strong>
      <span lang="ar">اختيار تطبيق الذكاء الاصطناعي المناسب</span>
      <small>Which application and technology fit the task?</small>
    </div>
    <div class="purpose-arrow" aria-hidden="true">→</div>
    <div class="purpose-step" data-number="4">
      <strong>Measurable Value</strong>
      <span lang="ar">قيمة قابلة للقياس</span>
      <small>Safety, quality, cost, speed, reliability or sustainability</small>
    </div>
  </div>

  <div class="concept-difference">
    <article class="concept-card">
      <div class="concept-label">WHAT IS USED?</div>
      <h3>AI Technology<span lang="ar">تقنية الذكاء الاصطناعي</span></h3>
      <p>The technical method, such as deep learning, reinforcement learning, NLP, or foundation models.</p>
      <p class="ar" lang="ar">الطريقة التقنية المستخدمة، مثل التعلم العميق أو التعلم المعزز أو معالجة اللغة الطبيعية أو النماذج التأسيسية.</p>
    </article>
    <article class="concept-card">
      <div class="concept-label">WHAT IS BUILT?</div>
      <h3>AI Application<span lang="ar">تطبيق الذكاء الاصطناعي</span></h3>
      <p>The practical solution, such as failure prediction, load forecasting, engineering assistance, or autonomous control.</p>
      <p class="ar" lang="ar">الحل العملي، مثل التنبؤ بالأعطال أو الأحمال، أو مساعدة المهندس، أو التحكم الذاتي.</p>
    </article>
    <article class="concept-card purpose">
      <div class="concept-label">WHY IS IT USED?</div>
      <h3>AI with Purpose<span lang="ar">الذكاء الاصطناعي الهادف</span></h3>
      <p>The reason and objective that justify choosing the application and its underlying technology.</p>
      <p class="ar" lang="ar">السبب والهدف اللذان يبرران اختيار التطبيق والتقنية التي يعتمد عليها.</p>
    </article>
  </div>

  <div class="umbrella-note">
    <b>AI with Purpose is the guiding umbrella:</b>
    <span lang="ar">الذكاء الاصطناعي الهادف هو المظلة التوجيهية التي تخضع لها جميع التطبيقات والتقنيات.</span>
  </div>
</section>
'''

          if '<section class="purpose-framework"' not in text:
              marker = '</section>\n<section class="overview">'
              if marker not in text:
                  raise SystemExit('HTML insertion marker not found')
              text = text.replace(marker, '</section>\n' + html + '<section class="overview">', 1)

          path.write_text(text, encoding='utf-8')

          workflow = Path('.github/workflows/add-ai-purpose-framework.yml')
          if workflow.exists():
              workflow.unlink()
          PY

      - name: Commit page update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes were needed."
          else
            git commit -m "Connect AI with Purpose to applications and value"
            git push
          fi
