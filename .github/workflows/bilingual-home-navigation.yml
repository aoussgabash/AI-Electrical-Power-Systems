name: Add bilingual homepage navigation

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/bilingual-home-navigation.yml'

permissions:
  contents: write

jobs:
  update-navigation:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Update homepage navigation labels
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('index.html')
          text = path.read_text(encoding='utf-8')

          replacements = [
              ('<a href="#structure">Structure</a>', '<a href="#structure">Structure | الهيكل</a>'),
              ('<a href="#progress">Progress</a>', '<a href="#progress">Progress | التقدم</a>'),
              ('<a href="#courses">Lectures & Labs</a>', '<a href="#courses">Lectures &amp; Labs | المحاضرات والمخابر</a>'),
              ('<a href="#courses">Lectures &amp; Labs</a>', '<a href="#courses">Lectures &amp; Labs | المحاضرات والمخابر</a>'),
              ('<a href="#features">Features</a>', '<a href="#features">Features | الميزات</a>'),
              ('<a href="#author">Author &amp; Profiles</a>', '<a href="#author">Author &amp; Profiles | المؤلف والملفات الأكاديمية</a>'),
              ('<a href="#author">Author & Profiles</a>', '<a href="#author">Author &amp; Profiles | المؤلف والملفات الأكاديمية</a>'),
          ]

          changed = False
          for old, new in replacements:
              if old in text:
                  text = text.replace(old, new)
                  changed = True

          required = [
              'Structure | الهيكل',
              'Progress | التقدم',
              'Lectures &amp; Labs | المحاضرات والمخابر',
              'Features | الميزات',
              'Author &amp; Profiles | المؤلف والملفات الأكاديمية',
          ]
          missing = [label for label in required if label not in text]
          if missing:
              raise SystemExit('Bilingual labels still missing: ' + ', '.join(missing))

          if changed:
              path.write_text(text, encoding='utf-8')
          PY

      - name: Commit homepage update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "Homepage navigation is already bilingual."
          else
            git commit -m "Make homepage navigation bilingual"
            git push
          fi
