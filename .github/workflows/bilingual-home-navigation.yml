name: Add bilingual homepage navigation

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/bilingual-home-navigation.yml'

permissions:
  contents: write

jobs:
  update-navigation:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Update homepage navigation labels
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('index.html')
          text = path.read_text(encoding='utf-8')

          replacements = {
              '<a href="#structure">Structure</a>': '<a href="#structure">Structure | الهيكل</a>',
              '<a href="#progress">Progress</a>': '<a href="#progress">Progress | التقدم</a>',
              '<a href="#courses">Lectures &amp; Labs</a>': '<a href="#courses">Lectures &amp; Labs | المحاضرات والمخابر</a>',
              '<a href="#features">Features</a>': '<a href="#features">Features | الميزات</a>',
              '<a href="#author">Author &amp; Profiles</a>': '<a href="#author">Author &amp; Profiles | المؤلف والملفات الأكاديمية</a>',
          }

          missing = []
          for old, new in replacements.items():
              if old not in text and new not in text:
                  missing.append(old)
              text = text.replace(old, new)

          if missing:
              raise SystemExit('Could not find expected navigation labels: ' + ', '.join(missing))

          path.write_text(text, encoding='utf-8')
          PY

      - name: Commit homepage update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "Homepage navigation is already bilingual."
          else
            git commit -m "Make homepage navigation bilingual"
            git push
          fi
