name: Unify country-only footer

on:
  push:
    paths:
      - '.github/workflows/unify-country-footer.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Standardize footer in all HTML and shared footer scripts
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          footer = '''<footer class="site-footer">
            <div class="container footer-wrap ag-global-footer">
              <span>© 2026 Dr.-Ing. Aouss Gabash | <span lang="ar" dir="rtl">الدكتور المهندس أوس غباش</span></span>
              <span>AG Academic Ecosystem | <span lang="ar" dir="rtl">منظومة AG الأكاديمية</span></span>
              <span>Germany | <span lang="ar" dir="rtl">ألمانيا</span> • Syria | <span lang="ar" dir="rtl">سوريا</span></span>
            </div>
          </footer>'''

          changed=[]
          for p in Path('.').rglob('*'):
              if not p.is_file() or p.suffix.lower() not in {'.html','.js'} or '.git' in p.parts or '.github' in p.parts:
                  continue
              s=p.read_text(encoding='utf-8',errors='ignore')
              old=s
              s=re.sub(r'<footer\b[^>]*>[\s\S]*?</footer>',footer,s,flags=re.I)
              s=s.replace('Ilmenau, Germany','Germany').replace('Homs, Syria','Syria')
              s=s.replace('إلميناو، ألمانيا','ألمانيا').replace('حمص، سوريا','سوريا')
              if p.name=='course-footer.js':
                  s=re.sub(r'Ilmenau[^\n`<]{0,80}Germany','Germany',s,flags=re.I)
                  s=re.sub(r'Homs[^\n`<]{0,80}Syria','Syria',s,flags=re.I)
              if s!=old:
                  p.write_text(s,encoding='utf-8')
                  changed.append(str(p))
          if not changed:
              raise SystemExit('No footer content changed')
          print('\n'.join(changed))
          PY
      - name: Validate and commit
        run: |
          grep -q 'Germany' index.html
          grep -q 'Syria' index.html
          ! grep -R -q 'Ilmenau, Germany' --include='*.html' --include='*.js' .
          ! grep -R -q 'Homs, Syria' --include='*.html' --include='*.js' .
          rm -f .github/workflows/unify-country-footer.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Unify footer and retain Germany and Syria only"
          git push
