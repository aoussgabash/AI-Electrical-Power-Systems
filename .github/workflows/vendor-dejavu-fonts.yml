name: Vendor DejaVu fonts for PDF certificates

on:
  push:
    paths:
      - '.github/workflows/vendor-dejavu-fonts.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  vendor-fonts:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Download DejaVu Sans fonts
        run: |
          set -euo pipefail
          mkdir -p assets/fonts /tmp/dejavu
          curl -fL --retry 3 --retry-delay 2 \
            'https://github.com/dejavu-fonts/dejavu-fonts/releases/download/version_2_37/dejavu-fonts-ttf-2.37.zip' \
            -o /tmp/dejavu/dejavu.zip
          unzip -q /tmp/dejavu/dejavu.zip -d /tmp/dejavu/extracted
          REGULAR=$(find /tmp/dejavu/extracted -type f -name 'DejaVuSans.ttf' | head -n 1)
          BOLD=$(find /tmp/dejavu/extracted -type f -name 'DejaVuSans-Bold.ttf' | head -n 1)
          test -n "$REGULAR"
          test -n "$BOLD"
          cp "$REGULAR" assets/fonts/DejaVuSans.ttf
          cp "$BOLD" assets/fonts/DejaVuSans-Bold.ttf
          test -s assets/fonts/DejaVuSans.ttf
          test -s assets/fonts/DejaVuSans-Bold.ttf

      - name: Update certificate generator to use DejaVu Sans
        shell: python
        run: |
          from pathlib import Path

          path = Path('course-quiz.js')
          text = path.read_text(encoding='utf-8')

          old = """      const fontFile = 'NotoNaskhArabic-Regular.ttf';
      if (!window.pdfMake.vfs?.[fontFile]) {
        const fontBase64 = await fetchAsBase64(
          'assets/fonts/NotoNaskhArabic-Regular.ttf'
        );
        window.pdfMake.vfs = window.pdfMake.vfs || {};
        window.pdfMake.vfs[fontFile] = fontBase64;
      }

      window.pdfMake.fonts = {
        NotoNaskhArabic: {
          normal: fontFile,
          bold: fontFile,
          italics: fontFile,
          bolditalics: fontFile
        }
      };
"""

          new = """      const fontFile = 'DejaVuSans.ttf';
      const fontBoldFile = 'DejaVuSans-Bold.ttf';
      window.pdfMake.vfs = window.pdfMake.vfs || {};

      if (!window.pdfMake.vfs?.[fontFile]) {
        window.pdfMake.vfs[fontFile] = await fetchAsBase64('assets/fonts/DejaVuSans.ttf');
      }
      if (!window.pdfMake.vfs?.[fontBoldFile]) {
        window.pdfMake.vfs[fontBoldFile] = await fetchAsBase64('assets/fonts/DejaVuSans-Bold.ttf');
      }

      window.pdfMake.fonts = {
        DejaVuSans: {
          normal: fontFile,
          bold: fontBoldFile,
          italics: fontFile,
          bolditalics: fontBoldFile
        }
      };
"""

          if old not in text:
              raise RuntimeError('Expected Noto font block was not found in course-quiz.js')

          text = text.replace(old, new)
          text = text.replace("font: 'NotoNaskhArabic'", "font: 'DejaVuSans'")
          path.write_text(text, encoding='utf-8')

      - name: Validate font integration
        shell: python
        run: |
          from pathlib import Path

          script = Path('course-quiz.js').read_text(encoding='utf-8')
          regular = Path('assets/fonts/DejaVuSans.ttf')
          bold = Path('assets/fonts/DejaVuSans-Bold.ttf')

          assert regular.exists() and regular.stat().st_size > 100000
          assert bold.exists() and bold.stat().st_size > 100000
          assert "font: 'DejaVuSans'" in script
          assert 'assets/fonts/DejaVuSans.ttf' in script
          assert 'assets/fonts/DejaVuSans-Bold.ttf' in script
          assert "font: 'NotoNaskhArabic'" not in script
          print('DejaVu certificate fonts validated.')

      - name: Commit font assets and generator update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/fonts/DejaVuSans.ttf assets/fonts/DejaVuSans-Bold.ttf course-quiz.js
          if git diff --cached --quiet; then
            echo "DejaVu fonts are already configured."
          else
            git commit -m "Use DejaVu fonts for multilingual PDF certificates"
            git push
          fi
