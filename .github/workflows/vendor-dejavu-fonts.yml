name: Vendor DejaVu fonts for PDF certificates

on:
  push:
    paths:
      - '.github/workflows/vendor-dejavu-fonts.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  vendor-fonts:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Download DejaVu Sans fonts
        run: |
          set -euo pipefail
          mkdir -p assets/fonts /tmp/dejavu/extracted
          curl -fL --retry 3 --retry-delay 2 \
            'https://github.com/dejavu-fonts/dejavu-fonts/releases/download/version_2_37/dejavu-fonts-ttf-2.37.zip' \
            -o /tmp/dejavu/dejavu.zip
          unzip -q /tmp/dejavu/dejavu.zip -d /tmp/dejavu/extracted
          REGULAR=$(find /tmp/dejavu/extracted -type f -name 'DejaVuSans.ttf' | head -n 1)
          BOLD=$(find /tmp/dejavu/extracted -type f -name 'DejaVuSans-Bold.ttf' | head -n 1)
          test -n "$REGULAR"
          test -n "$BOLD"
          cp "$REGULAR" assets/fonts/DejaVuSans.ttf
          cp "$BOLD" assets/fonts/DejaVuSans-Bold.ttf

      - name: Update certificate generator
        shell: python
        run: |
          from pathlib import Path
          import re

          path = Path('course-quiz.js')
          text = path.read_text(encoding='utf-8')

          pattern = re.compile(
              r"      const fontFile = 'NotoNaskhArabic-Regular\.ttf';.*?      };\n",
              re.S,
          )

          replacement = (
              "      const fontFile = 'DejaVuSans.ttf';\n"
              "      const fontBoldFile = 'DejaVuSans-Bold.ttf';\n"
              "      window.pdfMake.vfs = window.pdfMake.vfs || {};\n\n"
              "      if (!window.pdfMake.vfs?.[fontFile]) {\n"
              "        window.pdfMake.vfs[fontFile] = await fetchAsBase64('assets/fonts/DejaVuSans.ttf');\n"
              "      }\n"
              "      if (!window.pdfMake.vfs?.[fontBoldFile]) {\n"
              "        window.pdfMake.vfs[fontBoldFile] = await fetchAsBase64('assets/fonts/DejaVuSans-Bold.ttf');\n"
              "      }\n\n"
              "      window.pdfMake.fonts = {\n"
              "        DejaVuSans: {\n"
              "          normal: fontFile,\n"
              "          bold: fontBoldFile,\n"
              "          italics: fontFile,\n"
              "          bolditalics: fontBoldFile\n"
              "        }\n"
              "      };\n"
          )

          updated, count = pattern.subn(replacement, text, count=1)
          if count != 1:
              raise RuntimeError(f'Expected one Noto font block, found {count}')

          updated = updated.replace("font: 'NotoNaskhArabic'", "font: 'DejaVuSans'")
          path.write_text(updated, encoding='utf-8')

      - name: Validate integration
        shell: python
        run: |
          from pathlib import Path

          script = Path('course-quiz.js').read_text(encoding='utf-8')
          regular = Path('assets/fonts/DejaVuSans.ttf')
          bold = Path('assets/fonts/DejaVuSans-Bold.ttf')

          assert regular.exists() and regular.stat().st_size > 100000
          assert bold.exists() and bold.stat().st_size > 100000
          assert "font: 'DejaVuSans'" in script
          assert 'assets/fonts/DejaVuSans.ttf' in script
          assert 'assets/fonts/DejaVuSans-Bold.ttf' in script
          print('DejaVu certificate fonts validated.')

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/fonts/DejaVuSans.ttf assets/fonts/DejaVuSans-Bold.ttf course-quiz.js
          if git diff --cached --quiet; then
            echo "No changes needed."
          else
            git commit -m "Use DejaVu fonts for multilingual PDF certificates"
            git push
          fi
