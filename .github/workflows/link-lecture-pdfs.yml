name: Link lecture PDF downloads

on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/link-lecture-pdfs.mjs'
      - '.github/workflows/link-lecture-pdfs.yml'

permissions:
  contents: write

jobs:
  link-pdfs:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Update direct PDF links
        run: node scripts/link-lecture-pdfs.mjs

      - name: Validate direct links
        run: |
          grep -Fq 'href: `pdf/lecture${num}.pdf`' course-navigation.js
          grep -Fq 'downloadButton.setAttribute' course-navigation.js
          test -f pdf/lecture01.pdf

      - name: Commit direct download links
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add course-navigation.js
          if git diff --cached --quiet; then
            echo "Direct PDF links are already configured."
          else
            git commit -m "Link lecture cards to downloadable PDF files"
            git push
          fi
