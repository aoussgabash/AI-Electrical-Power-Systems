name: Attach corrected certificate generator

on:
  push:
    paths:
      - '.github/workflows/attach-certificate-generator.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  attach-generator:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Attach certificate generator to all lecture pages
        shell: python
        run: |
          from pathlib import Path

          changed = []
          marker = '<script src="course-quiz.js" defer></script>'
          addition = marker + '\n<script src="certificate-canvas.js?v=20260817-2" defer></script>'

          for number in range(1, 21):
              path = Path(f'lecture{number:02d}.html')
              if not path.exists():
                  continue

              text = path.read_text(encoding='utf-8')
              if 'certificate-canvas.js' in text:
                  continue
              if marker not in text:
                  raise RuntimeError(f'Quiz script marker not found in {path}')

              path.write_text(text.replace(marker, addition, 1), encoding='utf-8')
              changed.append(str(path))

          print('Updated:', ', '.join(changed) if changed else 'no files')

      - name: Validate attachment
        shell: python
        run: |
          from pathlib import Path

          found = 0
          for number in range(1, 21):
              path = Path(f'lecture{number:02d}.html')
              if not path.exists():
                  continue
              text = path.read_text(encoding='utf-8')
              assert 'course-quiz.js' in text
              assert 'certificate-canvas.js?v=20260817-2' in text
              assert text.index('course-quiz.js') < text.index('certificate-canvas.js')
              found += 1

          assert found > 0
          print(f'Validated {found} lecture pages.')

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lecture*.html
          if git diff --cached --quiet; then
            echo "No changes needed."
          else
            git commit -m "Attach corrected RTL certificate generator"
            git push
          fi
