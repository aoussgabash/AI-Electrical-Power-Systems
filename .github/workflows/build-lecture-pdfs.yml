name: Build downloadable course PDFs

on:
  workflow_dispatch:
  push:
    paths:
      - 'lecture*.html'
      - 'lab*.html'
      - 'course-common.css'
      - 'course-footer.css'
      - 'course-footer.js'
      - 'course-navigation.js'
      - 'scripts/build-lecture-pdfs.mjs'
      - '.github/workflows/build-lecture-pdfs.yml'

permissions:
  contents: write

# Updated to trigger regeneration after expanding Lectures/Labs 15, 16, 18, and 19.
jobs:
  build-pdfs:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Playwright
        run: |
          npm init -y
          npm install playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Start local website
        run: |
          python3 -m http.server 8000 > /tmp/course-http.log 2>&1 &
          sleep 3

      - name: Generate lecture and lab PDFs
        run: |
          mkdir -p pdf
          node scripts/build-lecture-pdfs.mjs

      - name: Validate generated files
        run: |
          lecture_count=$(find pdf -maxdepth 1 -type f -name 'lecture*.pdf' | wc -l)
          lab_count=$(find pdf -maxdepth 1 -type f -name 'lab*.pdf' | wc -l)
          test "$lecture_count" -eq 20
          test "$lab_count" -eq 20
          echo "Generated $lecture_count lecture PDFs and $lab_count lab PDFs."

      - name: Commit generated PDFs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pdf/
          if git diff --cached --quiet; then
            echo "Course PDFs are already up to date."
          else
            git commit -m "Build downloadable lecture and lab PDFs"
            git push
          fi
