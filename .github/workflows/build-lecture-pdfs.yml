name: Build downloadable course PDFs

on:
  workflow_dispatch:
  push:
    paths:
      - 'lecture*.html'
      - 'lab*.html'
      - 'course-common.css'
      - 'course-footer.css'
      - 'course-footer.js'
      - 'course-navigation.js'
      - 'scripts/build-lecture-pdfs.mjs'
      - 'scripts/render-pdfs-weasyprint.py'
      - 'scripts/pdf-publishing.css'
      - '.github/workflows/build-lecture-pdfs.yml'

permissions:
  contents: write

concurrency:
  group: course-pdf-build
  cancel-in-progress: true

jobs:
  build-pdfs:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install system publishing libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libcairo2 \
            libpango-1.0-0 \
            libpangoft2-1.0-0 \
            libharfbuzz0b \
            libharfbuzz-subset0 \
            libgdk-pixbuf-2.0-0 \
            libffi-dev \
            shared-mime-info \
            fonts-noto-core \
            fonts-noto-extra
          fc-cache -f -v

      - name: Install Playwright and Chromium
        timeout-minutes: 10
        env:
          PLAYWRIGHT_DOWNLOAD_CONNECTION_TIMEOUT: '120000'
        run: |
          npm init -y
          npm install --no-audit --no-fund playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Install WeasyPrint
        run: |
          python -m pip install --upgrade pip
          python -m pip install 'weasyprint==66.0'
          weasyprint --info

      - name: Start local website
        run: |
          python3 -m http.server 8000 > /tmp/course-http.log 2>&1 &
          echo $! > /tmp/course-http.pid
          sleep 3
          curl --fail --retry 5 --retry-delay 1 http://127.0.0.1:8000/lecture01.html > /dev/null

      - name: Prepare publication HTML snapshots
        timeout-minutes: 10
        run: |
          rm -rf build/pdf-html
          mkdir -p build/pdf-html pdf
          node scripts/build-lecture-pdfs.mjs

      - name: Render professional PDFs with WeasyPrint
        timeout-minutes: 10
        run: |
          python scripts/render-pdfs-weasyprint.py

      - name: Validate generated files
        run: |
          lecture_count=$(find pdf -maxdepth 1 -type f -name 'lecture*.pdf' | wc -l)
          lab_count=$(find pdf -maxdepth 1 -type f -name 'lab*.pdf' | wc -l)
          test "$lecture_count" -eq 20
          test "$lab_count" -eq 20
          find pdf -maxdepth 1 -type f -name '*.pdf' -size -10k -print -quit | grep -q . && {
            echo 'At least one generated PDF is unexpectedly small.'
            exit 1
          } || true
          echo "Generated $lecture_count lecture PDFs and $lab_count laboratory PDFs."

      - name: Commit generated PDFs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pdf/

          if git diff --cached --quiet; then
            echo "Course PDFs are already up to date."
            exit 0
          fi

          git commit -m "Publish professional course PDFs v1.0"

          # The main branch may receive another commit while PDFs are rendering.
          # Rebase the generated-PDF commit onto the newest main before pushing.
          for attempt in 1 2 3; do
            git fetch origin main
            git rebase origin/main

            if git push origin HEAD:main; then
              echo "Generated PDFs published successfully."
              exit 0
            fi

            echo "Push attempt $attempt failed because main changed; retrying..."
            sleep $((attempt * 3))
          done

          echo "Unable to publish generated PDFs after three attempts."
          exit 1
