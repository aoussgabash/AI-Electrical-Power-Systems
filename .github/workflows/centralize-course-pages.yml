name: Centralize course pages

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'lecture*.html'
      - 'lab*.html'
      - 'tools/centralize-course-pages.mjs'
      - '.github/workflows/centralize-course-pages.yml'

permissions:
  contents: write

jobs:
  centralize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Centralize course pages
        run: node tools/centralize-course-pages.mjs --write

      - name: Validate generated pages
        run: node tools/centralize-course-pages.mjs --check

      - name: Commit generated cleanup
        run: |
          if git diff --quiet; then
            echo 'No cleanup changes required.'
            exit 0
          fi

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add lecture*.html lab*.html
          git commit -m 'Centralize lecture and lab page markup'
          git push
