name: Fix SVG rendering in generated PDFs

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/fix-svg-pdf-rendering.yml'

permissions:
  contents: write

jobs:
  patch-generator:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Patch PDF snapshot generator
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('scripts/build-lecture-pdfs.mjs')
          text = path.read_text(encoding='utf-8')

          old_css = '''svg{background:#fff!important;color:#111827!important}
          svg text,svg tspan{fill:#111827!important;color:#111827!important}
          svg line,svg polyline,svg path{stroke:#475569!important}
          a{color:#0f4c81!important;text-decoration:none!important}'''.replace('          ', '')

          new_css = '''svg{background:#fff!important}
          a{color:#0f4c81!important;text-decoration:none!important}'''.replace('          ', '')

          if old_css not in text:
              raise SystemExit('Expected SVG print CSS block was not found.')
          text = text.replace(old_css, new_css, 1)

          marker = '''      const style = document.createElement('style');
          style.id = 'weasyprint-course-pdf';'''.replace('          ', '')

          snapshot = '''      // Preserve the exact SVG appearance computed by Chromium before
      // applying the light print stylesheet. WeasyPrint then receives
      // explicit inline presentation values instead of unresolved CSS classes.
      document.querySelectorAll('svg').forEach(svg => {
        svg.setAttribute('xmlns', 'http://www.w3.org/2000/svg');
        svg.querySelectorAll('*').forEach(element => {
          const computed = getComputedStyle(element);
          const properties = [
            'fill', 'fill-opacity', 'fill-rule',
            'stroke', 'stroke-width', 'stroke-opacity',
            'stroke-linecap', 'stroke-linejoin', 'stroke-dasharray',
            'opacity', 'color',
            'font-family', 'font-size', 'font-style', 'font-weight',
            'text-anchor', 'dominant-baseline'
          ];

          properties.forEach(property => {
            const value = computed.getPropertyValue(property);
            if (value && value !== 'normal') {
              element.style.setProperty(property, value, 'important');
            }
          });
        });
      });

      const style = document.createElement('style');
      style.id = 'weasyprint-course-pdf';'''

          if marker not in text:
              raise SystemExit('Expected style insertion marker was not found.')
          text = text.replace(marker, snapshot, 1)
          path.write_text(text, encoding='utf-8')
          PY

      - name: Commit generator fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/build-lecture-pdfs.mjs
          git commit -m "Preserve computed SVG styles in PDF snapshots"
          git push
