name: Attach shared course CSS

on:
  push:
    paths:
      - '.github/workflows/attach-course-common-css.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  attach-css:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Add shared stylesheet to all lecture and lab pages
        shell: python
        run: |
          from pathlib import Path
          import re

          link_tag = '<link rel="stylesheet" href="course-common.css">'
          changed = []

          for prefix in ('lecture', 'lab'):
              for number in range(1, 21):
                  path = Path(f'{prefix}{number:02d}.html')
                  if not path.exists():
                      print(f'Skipping missing file: {path}')
                      continue

                  text = path.read_text(encoding='utf-8')

                  if 'course-common.css' in text:
                      print(f'Already linked: {path}')
                      continue

                  if re.search(r'</head\s*>', text, flags=re.I):
                      new_text = re.sub(
                          r'</head\s*>',
                          link_tag + '\n</head>',
                          text,
                          count=1,
                          flags=re.I
                      )
                  else:
                      new_text = link_tag + '\n' + text

                  path.write_text(new_text, encoding='utf-8')
                  changed.append(str(path))

          print('Changed files:')
          for path in changed:
              print(path)

      - name: Commit shared stylesheet integration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lecture{01..20}.html lab{01..20}.html
          if git diff --cached --quiet; then
            echo "All pages already use the shared stylesheet."
          else
            git commit -m "Attach shared stylesheet to all course pages"
            git push
          fi
