name: Use custom electrical power laboratory icon

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/replace-lab-icon.yml'

permissions:
  contents: write

jobs:
  replace-icon:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Apply custom laboratory icon
        run: |
          python3 - <<'PY'
          from pathlib import Path

          home_icon = '<img src="assets/icons/electrical-power-lab.svg" class="electrical-lab-icon" alt="Electrical power laboratory" style="width:58px;height:58px;display:block;object-fit:contain">'
          nav_icon = '<img src="assets/icons/electrical-power-lab.svg" class="electrical-lab-icon" alt="Electrical power laboratory" style="width:42px;height:42px;display:block;object-fit:contain">'

          index_path = Path('index.html')
          index = index_path.read_text(encoding='utf-8')
          old_home = '<span class="icon">⚡</span>'
          count = index.count(old_home)
          index = index.replace(old_home, f'<span class="icon">{home_icon}</span>')
          index_path.write_text(index, encoding='utf-8')
          print(f'Homepage icons replaced: {count}')

          nav_path = Path('course-navigation.js')
          nav = nav_path.read_text(encoding='utf-8')
          anchor = "const authorName = 'Dr.-Ing. Aouss Gabash';"
          declaration = f"const labIcon = '{nav_icon}';"
          if 'const labIcon =' not in nav:
              nav = nav.replace(anchor, anchor + '\n  ' + declaration)

          nav = nav.replace("icon: type === 'lecture' ? '📖' : '⚡'", "icon: type === 'lecture' ? '📖' : labIcon")
          nav = nav.replace("icon: type === 'lecture' ? '⚡' : '📖'", "icon: type === 'lecture' ? labIcon : '📖'")
          nav = nav.replace(
              '.course-action-icon{font-size:2rem;line-height:1}',
              '.course-action-icon{font-size:2rem;line-height:1;display:flex;align-items:center;justify-content:center}.course-action-icon img{max-width:48px;max-height:48px}'
          )
          nav_path.write_text(nav, encoding='utf-8')

          if 'assets/icons/electrical-power-lab.svg' not in index:
              raise SystemExit('Custom icon was not inserted into index.html')
          if 'assets/icons/electrical-power-lab.svg' not in nav:
              raise SystemExit('Custom icon was not inserted into course-navigation.js')
          PY

      - name: Commit icon update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html course-navigation.js
          if git diff --cached --quiet; then
            echo "Custom laboratory icons are already active."
          else
            git commit -m "Use custom electrical power icon for laboratories"
            git push
          fi
