name: Replace lab icon with electrical power symbol

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/replace-lab-icon.yml'

permissions:
  contents: write

jobs:
  replace-icon:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Replace lab icons
        run: |
          python3 - <<'PY'
          from pathlib import Path

          files = [Path('index.html'), Path('course-navigation.js')]
          total = 0

          for path in files:
              text = path.read_text(encoding='utf-8')
              count = text.count('🧪')
              text = text.replace('🧪', '⚡')
              path.write_text(text, encoding='utf-8')
              total += count
              print(f'{path}: replaced {count} icon(s)')

          if total == 0:
              print('No chemistry lab icons remained; files may already be updated.')
          PY

      - name: Commit icon update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html course-navigation.js
          if git diff --cached --quiet; then
            echo "Lab icons are already updated."
          else
            git commit -m "Use electrical power icon for laboratories"
            git push
          fi
