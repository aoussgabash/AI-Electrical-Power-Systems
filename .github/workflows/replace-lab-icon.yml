name: Fix homepage electrical laboratory icon

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/replace-lab-icon.yml'

permissions:
  contents: write

jobs:
  fix-home-icon:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Fix homepage laboratory icon CSS
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('course-footer.css')
          css = path.read_text(encoding='utf-8')

          css = css.replace('a[href^="lab"] .icon', 'a[href*="lab"] .icon')

          override = r'''

/* Final homepage laboratory-icon override. */
a.course-card[href*="lab"] .icon,
.course-card[href*="lab"] .card-top .icon,
a[href*="lab"] .card-top .icon{
  position:relative!important;
  display:inline-flex!important;
  align-items:center!important;
  justify-content:center!important;
  width:58px!important;
  height:58px!important;
  min-width:58px!important;
  overflow:hidden!important;
  text-indent:-9999px!important;
  white-space:nowrap!important;
  font-size:0!important;
  line-height:0!important;
  color:transparent!important;
  background:none!important;
}

a.course-card[href*="lab"] .icon::before,
.course-card[href*="lab"] .card-top .icon::before,
a[href*="lab"] .card-top .icon::before{
  content:""!important;
  position:absolute!important;
  inset:0!important;
  display:block!important;
  background:url("assets/icons/electrical-power-lab.svg") center/contain no-repeat!important;
}

@media(max-width:620px){
  a.course-card[href*="lab"] .icon,
  .course-card[href*="lab"] .card-top .icon,
  a[href*="lab"] .card-top .icon{
    width:52px!important;
    height:52px!important;
    min-width:52px!important;
  }
}
'''

          if 'Final homepage laboratory-icon override' not in css:
              css += override

          path.write_text(css, encoding='utf-8')
          PY

      - name: Commit homepage icon fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add course-footer.css
          if git diff --cached --quiet; then
            echo "Homepage laboratory icon is already fixed."
          else
            git commit -m "Fix electrical laboratory icon on homepage cards"
            git push
          fi
