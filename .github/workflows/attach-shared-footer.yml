name: Attach shared footer to all pages

on:
  push:
    paths:
      - '.github/workflows/attach-shared-footer.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  attach-footer:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Attach footer CSS and JavaScript
        shell: python
        run: |
          from pathlib import Path
          import re

          pages = [Path('index.html')]
          pages += [Path(f'lecture{n:02d}.html') for n in range(1, 21)]
          pages += [Path(f'lab{n:02d}.html') for n in range(1, 21)]

          css_tag = '<link rel="stylesheet" href="course-footer.css">'
          script_tag = '<script src="course-footer.js" defer></script>'
          changed = []

          for path in pages:
              if not path.exists():
                  print(f'Skipping missing file: {path}')
                  continue

              text = path.read_text(encoding='utf-8')
              original = text

              if 'course-footer.css' not in text:
                  if re.search(r'</head\s*>', text, flags=re.I):
                      text = re.sub(r'</head\s*>', css_tag + '\n</head>', text, count=1, flags=re.I)
                  else:
                      text = css_tag + '\n' + text

              if 'course-footer.js' not in text:
                  if re.search(r'</body\s*>', text, flags=re.I):
                      text = re.sub(r'</body\s*>', script_tag + '\n</body>', text, count=1, flags=re.I)
                  else:
                      text += '\n' + script_tag + '\n'

              if text != original:
                  path.write_text(text, encoding='utf-8')
                  changed.append(str(path))

          print('Changed files:')
          for path in changed:
              print(path)

      - name: Validate footer integration
        shell: python
        run: |
          from pathlib import Path

          pages = [Path('index.html')]
          pages += [Path(f'lecture{n:02d}.html') for n in range(1, 21)]
          pages += [Path(f'lab{n:02d}.html') for n in range(1, 21)]

          for path in pages:
              if not path.exists():
                  continue
              text = path.read_text(encoding='utf-8')
              assert text.count('course-footer.css') == 1, f'Footer CSS issue in {path}'
              assert text.count('course-footer.js') == 1, f'Footer JS issue in {path}'
              assert text.index('course-footer.css') < text.lower().index('</head>'), f'Footer CSS is outside head in {path}'
              assert text.index('course-footer.js') < text.lower().index('</body>'), f'Footer JS is outside body in {path}'
              print(f'Validated: {path}')

      - name: Commit shared footer integration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html lecture{01..20}.html lab{01..20}.html
          if git diff --cached --quiet; then
            echo "All pages already use the shared footer."
          else
            git commit -m "Attach shared Version 1.0 footer to all pages"
            git push
          fi
