name: Review Lecture 06

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/review-lecture06.yml'

permissions:
  contents: write

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Replace Lecture 06 quiz with reviewed GA quiz
        shell: python
        run: |
          from pathlib import Path

          quiz_file = Path('course-quiz-data.js')
          source = quiz_file.read_text(encoding='utf-8')
          start_marker = "    lecture06: { questions: ["
          end_marker = "\n\n    lecture07: { questions: ["
          start = source.index(start_marker)
          end = source.index(end_marker, start)

          reviewed = """    lecture06: { questions: [
                Q('What does a chromosome represent in a Genetic Algorithm?','ماذا يمثل الكروموسوم في الخوارزمية الجينية؟',1,[['A single random error','خطأ عشوائي واحد'],['One complete candidate solution','حلًا مرشحًا كاملًا'],['Only the objective value','قيمة دالة الهدف فقط'],['A fixed stopping rule','قاعدة توقف ثابتة']],'A chromosome encodes one complete candidate solution, while each gene represents one decision variable. | يرمز الكروموسوم إلى حل مرشح كامل، بينما يمثل كل جين متغير قرار واحدًا.'),
                Q('For a minimization problem using Fitness(x)=1/[1+J(x)], what happens when J(x) decreases?','في مسألة تصغير تستخدم Fitness(x)=1/[1+J(x)]، ماذا يحدث عندما تنخفض J(x)؟',2,[['Fitness decreases','تنخفض الملاءمة'],['Fitness becomes negative','تصبح الملاءمة سالبة'],['Fitness increases','تزداد الملاءمة'],['Fitness is unchanged','لا تتغير الملاءمة']],'A smaller objective value gives a larger fitness value and therefore a greater chance of selection. | تؤدي القيمة الأصغر لدالة الهدف إلى ملاءمة أكبر وفرصة اختيار أعلى.'),
                Q('What is the purpose of a penalty function in constrained optimization?','ما هدف دالة العقوبة في التحسين المقيد؟',0,[['Increase the cost of infeasible solutions','زيادة كلفة الحلول المخالفة للقيود'],['Remove the objective function','إلغاء دالة الهدف'],['Guarantee every chromosome is feasible','ضمان أن كل كروموسوم مقبول'],['Replace mutation','استبدال الطفرة']],'The penalized objective Jₚ(x)=J(x)+λP(x) discourages constraint violations. | تضيف العلاقة Jₚ(x)=J(x)+λP(x) عقوبة للحلول التي تخرق القيود.'),
                Q('How is the initial population usually generated?','كيف يتم عادة توليد المجتمع الابتدائي؟',3,[['From one identical chromosome only','من كروموسوم واحد متطابق فقط'],['Outside all allowed limits','خارج جميع الحدود المسموحة'],['By copying the final solution','بنسخ الحل النهائي'],['Randomly within the allowed bounds','عشوائيًا ضمن الحدود المسموحة']],'A diverse random population within the variable bounds improves exploration of the search space. | يحسن المجتمع العشوائي المتنوع ضمن الحدود استكشاف فضاء البحث.'),
                Q('In roulette-wheel selection, the probability of selecting candidate i is:','في اختيار عجلة الروليت، احتمال اختيار المرشح i هو:',1,[['pᵢ = Jᵢ²','pᵢ = Jᵢ²'],['pᵢ = Fᵢ/ΣFⱼ','pᵢ = Fᵢ/ΣFⱼ'],['pᵢ = 1/Fᵢ²','pᵢ = 1/Fᵢ²'],['pᵢ = 0 for the best candidate','pᵢ = 0 لأفضل مرشح']],'Roulette-wheel selection assigns probability proportional to fitness. | يخصص اختيار عجلة الروليت احتمالًا يتناسب مع قيمة الملاءمة.'),
                Q('What is the main role of crossover?','ما الدور الأساسي لعملية التزاوج أو العبور؟',2,[['Delete all parents','حذف جميع الآباء'],['Apply constraint penalties','تطبيق عقوبات القيود'],['Combine information from two parents to create offspring','دمج معلومات من أبوين لإنتاج أفراد جديدة'],['Stop the algorithm immediately','إيقاف الخوارزمية فورًا']],'Crossover recombines parental information to create new candidate solutions. | يعيد العبور تركيب معلومات الأبوين لتكوين حلول مرشحة جديدة.'),
                Q('Why is mutation used in a Genetic Algorithm?','لماذا تستخدم الطفرة في الخوارزمية الجينية؟',0,[['To preserve diversity and explore new regions','للحفاظ على التنوع واستكشاف مناطق جديدة'],['To guarantee the exact global optimum','لضمان الحل الأمثل العالمي بدقة'],['To remove all random behavior','لإزالة كل السلوك العشوائي'],['To copy the best solution unchanged','لنسخ أفضل حل دون تغيير']],'Mutation introduces small random changes that reduce the risk of premature convergence. | تضيف الطفرة تغييرات عشوائية صغيرة تقلل خطر التقارب المبكر.'),
                Q('What does elitism do?','ماذا تفعل النخبوية؟',3,[['Mutates every chromosome','تُحدث طفرة في كل كروموسوم'],['Deletes the best candidate','تحذف أفضل مرشح'],['Selects only infeasible solutions','تختار الحلول المخالفة فقط'],['Copies one or more best solutions directly to the next generation','تنقل حلًا أو أكثر من أفضل الحلول مباشرة إلى الجيل التالي']],'Elitism protects the best solutions from being lost during reproduction. | تحمي النخبوية أفضل الحلول من الضياع أثناء تكوين الجيل الجديد.'),
                Q('For J(x)=x² and candidates x={-2,-1,0.5,3}, which candidate has the highest Fitness=1/(1+J)?','بالنسبة إلى J(x)=x² والمرشحين x={-2,-1,0.5,3}، أي مرشح يمتلك أعلى Fitness=1/(1+J)؟',2,[['x=-2','x=-2'],['x=-1','x=-1'],['x=0.5','x=0.5'],['x=3','x=3']],'For x=0.5, J=0.25 and Fitness=1/1.25=0.80, which is the largest value. | عند x=0.5 تكون J=0.25 وFitness=0.80، وهي القيمة الأكبر.'),
                Q('Which is a suitable power-system application of a Genetic Algorithm?','أي مما يلي تطبيق مناسب للخوارزمية الجينية في نظم الطاقة؟',1,[['Changing physical constants','تغيير الثوابت الفيزيائية'],['Optimal placement or scheduling of power-system resources','التوضع الأمثل أو جدولة موارد نظام الطاقة'],['Removing all network constraints','إلغاء جميع قيود الشبكة'],['Guaranteeing zero losses without optimization','ضمان انعدام الفواقد دون تحسين']],'Genetic Algorithms are suitable for nonlinear and combinatorial tasks such as placement, sizing, scheduling, and dispatch. | تناسب الخوارزميات الجينية مسائل لاخطية وتوافقية مثل التوضع والتحجيم والجدولة والتشغيل الأمثل.')
              ]},"""

          quiz_file.write_text(source[:start] + reviewed + source[end:], encoding='utf-8')

          lecture = Path('lecture06.html')
          html = lecture.read_text(encoding='utf-8')
          html = html.replace('course-quiz-data.js" defer', 'course-quiz-data.js?v=20260831-6" defer')
          lecture.write_text(html, encoding='utf-8')

          workflow = Path('.github/workflows/review-lecture06.yml')
          workflow.unlink()

      - name: Validate Lecture 06
        run: |
          node --check course-quiz-data.js
          test "$(grep -c "lecture06: { questions:" course-quiz-data.js)" -eq 1
          test "$(sed -n '/lecture06: { questions:/,/lecture07: { questions:/p' course-quiz-data.js | grep -c "^      Q(")" -eq 10
          grep -q "Genetic Algorithms" lecture06.html
          grep -q "course-quiz-data.js?v=20260831-6" lecture06.html
          test ! -e .github/workflows/review-lecture06.yml

      - name: Commit reviewed Lecture 06
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Review Lecture 06 and add matching 10-question quiz"
          git push
