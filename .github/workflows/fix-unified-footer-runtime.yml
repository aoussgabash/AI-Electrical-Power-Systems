name: Synchronize canonical AI footer

on:
  push:
    paths:
      - '.github/workflows/fix-unified-footer-runtime.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update the shared footer source
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path('course-footer.js')
          text = path.read_text(encoding='utf-8')
          replacement = '''footer.innerHTML = `
    <div class="site-footer-inner ag-global-footer">
      <div class="footer-copy">© 2026 Dr.-Ing. Aouss Gabash | <span lang="ar" dir="rtl">الدكتور المهندس أوس غباش</span></div>
      <div class="footer-copy">AG Academic Ecosystem | <span lang="ar" dir="rtl">منظومة AG الأكاديمية</span></div>
      <div class="footer-copy">Germany | <span lang="ar" dir="rtl">ألمانيا</span> • Syria | <span lang="ar" dir="rtl">سوريا</span></div>
    </div>`;'''

          if 'class="site-footer-inner ag-global-footer"' not in text:
              text, count = re.subn(
                  r'footer\.innerHTML\s*=\s*`[\s\S]*?`;',
                  replacement,
                  text,
                  count=1,
              )
              if count != 1:
                  raise SystemExit('The shared footer block was not found in course-footer.js')

          path.write_text(text, encoding='utf-8')
          PY
      - name: Commit only the shared footer source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add course-footer.js
          git diff --cached --quiet && exit 0
          git commit -m "Use canonical AG footer across AI pages"
          git push
