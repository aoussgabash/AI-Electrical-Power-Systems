name: Review Lecture 07

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/review-lecture07.yml'

permissions:
  contents: write

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Replace Lecture 07 quiz with reviewed deep-learning quiz
        shell: python
        run: |
          from pathlib import Path

          quiz_file = Path('course-quiz-data.js')
          source = quiz_file.read_text(encoding='utf-8')
          start_marker = "    lecture07: { questions: ["
          end_marker = "\n\n    lecture08: { questions: ["
          start = source.index(start_marker)
          end = source.index(end_marker, start)

          reviewed = """    lecture07: { questions: [
                Q('What mainly makes a neural network deep?','ما الذي يجعل الشبكة العصبية عميقة أساسًا؟',1,[['Using only one neuron','استخدام عصبون واحد فقط'],['Having multiple hidden layers','امتلاك عدة طبقات مخفية'],['Using no activation functions','عدم استخدام دوال تنشيط'],['Training without data','التدريب دون بيانات']],'Deep learning relies mainly on neural networks with multiple hidden layers that learn hierarchical representations. | يعتمد التعلم العميق أساسًا على شبكات عصبية متعددة الطبقات المخفية تتعلم تمثيلات هرمية.'),
                Q('What is hierarchical feature learning?','ما المقصود بالتعلم الهرمي للميزات؟',2,[['Every layer copies the raw input unchanged','تنسخ كل طبقة الدخل الخام دون تغيير'],['Only the output layer learns','تتعلم طبقة الخرج فقط'],['Later layers build complex features from simpler features','تبني الطبقات اللاحقة ميزات معقدة من ميزات أبسط'],['Features are selected randomly and never updated','تختار الميزات عشوائيًا ولا تُحدّث']],'Successive layers transform simple patterns into increasingly abstract representations. | تحول الطبقات المتتالية الأنماط البسيطة إلى تمثيلات أكثر تعقيدًا وتجريدًا.'),
                Q('Which expression defines the ReLU activation function?','أي علاقة تعرّف دالة التنشيط ReLU؟',0,[['ReLU(z)=max(0,z)','ReLU(z)=max(0,z)'],['ReLU(z)=1/(1+e⁻ᶻ)','ReLU(z)=1/(1+e⁻ᶻ)'],['ReLU(z)=z²','ReLU(z)=z²'],['ReLU(z)=min(0,z)','ReLU(z)=min(0,z)']],'ReLU outputs zero for negative inputs and returns the input itself for positive inputs. | تعطي ReLU صفرًا للقيم السالبة وتعيد القيمة نفسها للقيم الموجبة.'),
                Q('What happens when gradients vanish in a deep network?','ماذا يحدث عند تلاشي التدرجات في شبكة عميقة؟',3,[['The output becomes exactly one','يصبح الخرج واحدًا تمامًا'],['All weights become equal','تصبح جميع الأوزان متساوية'],['The dataset becomes larger','تكبر مجموعة البيانات'],['Early layers learn very slowly','تتعلم الطبقات الأولى ببطء شديد']],'Products of many small derivatives can make gradients near the input layers extremely small. | قد يجعل حاصل ضرب مشتقات صغيرة عديدة التدرجات قرب طبقات الدخل صغيرة جدًا.'),
                Q('What are CNNs especially designed to learn?','ما الذي صممت CNN لتعلمه بصورة خاصة؟',1,[['Only exact algebraic equations','المعادلات الجبرية الدقيقة فقط'],['Local patterns in structured arrays','الأنماط المحلية في المصفوفات المنظمة'],['Only random labels','التسميات العشوائية فقط'],['No spatial relationships','دون علاقات مكانية']],'Convolutional neural networks learn local filters from images, time-frequency maps, and spatial measurements. | تتعلم الشبكات الالتفافية مرشحات محلية من الصور والخرائط الزمنية-الترددية والقياسات المكانية.'),
                Q('What information does the hidden state hₜ represent in an RNN?','ماذا تمثل الحالة المخفية hₜ في شبكة RNN؟',2,[['Only the current output label','تسمية الخرج الحالية فقط'],['The number of layers','عدد الطبقات'],['Memory of current and previous sequence information','ذاكرة لمعلومات التسلسل الحالية والسابقة'],['A fixed random constant','ثابتًا عشوائيًا ثابتًا']],'The recurrent hidden state carries information from previous time steps into the current computation. | تنقل الحالة المخفية المتكررة معلومات الأزمنة السابقة إلى الحساب الحالي.'),
                Q('Why are LSTM networks useful for sequential data?','لماذا تفيد شبكات LSTM للبيانات المتسلسلة؟',0,[['Their gates help preserve and control long-term information','تساعد بواباتها على حفظ المعلومات طويلة الأمد والتحكم بها'],['They remove all hidden states','تلغي جميع الحالات المخفية'],['They work only with images','تعمل مع الصور فقط'],['They require no training','لا تحتاج إلى تدريب']],'Forget, input, and output gates regulate what information is retained, updated, or exposed. | تنظم بوابات النسيان والدخل والخرج المعلومات التي تُحفظ أو تُحدّث أو تُظهر.'),
                Q('Which sequence best describes one training step of a deep network?','أي تسلسل يصف خطوة تدريب واحدة لشبكة عميقة؟',1,[['Mutation → crossover → selection','طفرة ← تزاوج ← اختيار'],['Forward pass → loss → backpropagation → parameter update','انتشار أمامي ← خطأ ← انتشار خلفي ← تحديث المعاملات'],['Clustering → PCA → anomaly detection','تجميع ← PCA ← كشف الشذوذ'],['Encryption → compression → storage','تشفير ← ضغط ← تخزين']],'Training computes predictions, evaluates the loss, obtains gradients by backpropagation, then updates parameters. | يحسب التدريب التنبؤات ثم الخطأ ثم التدرجات بالانتشار الخلفي ثم يحدّث المعاملات.'),
                Q('Which regularization method randomly disables neurons during training?','أي طريقة تنظيم تعطل عصبونات عشوائيًا أثناء التدريب؟',3,[['Momentum','الزخم'],['Pooling','التجميع Pooling'],['Convolution','الالتفاف'],['Dropout','Dropout']],'Dropout reduces co-adaptation by randomly disabling units during training. | يقلل Dropout الاعتماد المشترك بين العصبونات عبر تعطيل وحدات عشوائيًا أثناء التدريب.'),
                Q('Which is a deep-learning application in power systems mentioned in the lecture?','أي مما يلي تطبيق للتعلم العميق في نظم الطاقة ورد في المحاضرة؟',2,[['Changing physical constants','تغيير الثوابت الفيزيائية'],['Removing all measurements','إلغاء جميع القياسات'],['Load forecasting, fault diagnosis, or battery-state estimation','التنبؤ بالحمل أو تشخيص الأعطال أو تقدير حالة البطارية'],['Guaranteeing zero losses','ضمان انعدام الفواقد']],'The lecture includes load and renewable forecasting, fault diagnosis, state estimation, and battery management. | تتضمن المحاضرة التنبؤ بالحمل والطاقة المتجددة وتشخيص الأعطال وتقدير الحالة وإدارة البطاريات.')
              ]},"""

          quiz_file.write_text(source[:start] + reviewed + source[end:], encoding='utf-8')

          lecture = Path('lecture07.html')
          html = lecture.read_text(encoding='utf-8')
          html = html.replace('course-quiz-data.js" defer', 'course-quiz-data.js?v=20260831-7" defer')
          lecture.write_text(html, encoding='utf-8')

          workflow = Path('.github/workflows/review-lecture07.yml')
          workflow.unlink()

      - name: Validate Lecture 07
        run: |
          node --check course-quiz-data.js
          test "$(grep -c "lecture07: { questions:" course-quiz-data.js)" -eq 1
          test "$(sed -n '/lecture07: { questions:/,/lecture08: { questions:/p' course-quiz-data.js | grep -c "^      Q(")" -eq 10
          grep -q "Lecture 07 - Deep Learning" lecture07.html
          grep -q "course-quiz-data.js?v=20260831-7" lecture07.html
          grep -q "course-quiz.js" lecture07.html
          grep -q "certificate-canvas.js" lecture07.html
          test ! -e .github/workflows/review-lecture07.yml

      - name: Commit reviewed Lecture 07
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Review Lecture 07 and add matching 10-question quiz"
          git push
